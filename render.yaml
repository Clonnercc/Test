services:
  - type: web
    name: wa-control
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PERSISTENT_ROOT
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: PAINEL_USUARIO
        value: admin
      - key: PAINEL_SENHA
        sync: false
    disk:
      name: wa-control-data
      mountPath: /var/data
      sizeGB: 1
